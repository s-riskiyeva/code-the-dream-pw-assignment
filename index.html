<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code the Dream pw assignment</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="header">
      <h1>This is the Cats' World!</h1>
      <nav class="top-nav">
        <button id="breedsByCountryButton">Breeds By Country</button>
        <button id="catImagesGalleryButton">Cat Images Callery</button>
      </nav>
    </header>

    <main>
      <section id="breedsSection" class="main-layout" style="display: none">
        <div class="left-panel-breeds-search">
          <input
            type="text"
            id="nameOfCountryInput"
            placeholder="Country name...e.g., Egypt, United States..."
          />
          <button id="nameOfCountryButton">Find breeds</button>
          <div id="listOfBreeds"></div>
        </div>

        <aside class="right-panel" id="breedDetailsCard">
          <div class="right-panel-placeholder-message">
            <p>
              Select a breed card from the left panel to view full facts and
              history details
            </p>
          </div>
        </aside>
      </section>

      <section id="imagesGallerySection" style="display: none">
        <h2>Cat Images Gallery</h2>
        <button id="loadRandomCatImageButton">Wanna See More Cats</button>
        <div id="catsImages"></div>
      </section>
    </main>

    <script type="module" src="script.js"></script>
  </body>
</html>
